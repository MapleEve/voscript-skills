name: Publish to npm + GitHub Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.pkg }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check publication state
        id: version
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          PKG_VERSION=$(node -p "require('./package.json').version")
          [[ "$PKG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm view voscript-skills versions --json > "$RUNNER_TEMP/npm-versions.json"
          PUBLISHED=$(node -e '
            const fs = require("node:fs");
            const versions = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!Array.isArray(versions)) throw new Error("Invalid registry response");
            console.log(versions.includes(process.argv[2]) ? "true" : "false");
          ' "$RUNNER_TEMP/npm-versions.json" "$PKG_VERSION")
          RELEASE=true
          if [ "$PUBLISHED" = true ]; then
            PUBLISHED_SHA=$(npm view "voscript-skills@$PKG_VERSION" gitHead)
            if [ "$PUBLISHED_SHA" != "$RELEASE_SHA" ]; then
              RELEASE=false
              echo "Version already published from a different commit; no new release."
            fi
          fi
          echo "pkg=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Verify existing tag target
        if: steps.version.outputs.release == 'true'
        env:
          TAG: v${{ steps.version.outputs.pkg }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$RELEASE_SHA"
          fi

      - name: Publish to npm
        if: steps.version.outputs.published == 'false'
        run: npm publish --provenance --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm source commit
        if: steps.version.outputs.release == 'true'
        env:
          PKG_VERSION: ${{ steps.version.outputs.pkg }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(npm view "voscript-skills@$PKG_VERSION" gitHead)" = "$RELEASE_SHA"

  release:
    needs: publish
    if: needs.publish.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub Release at published commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          TAG: v${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$RELEASE_SHA"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists for the published commit."
            exit 0
          fi
          gh release create "$TAG" --target "$RELEASE_SHA" \
            --title "$TAG" \
            --notes "$(cat <<'NOTES'
          Install or update:
          ```bash
          npx voscript-skills
          ```
          npm: https://www.npmjs.com/package/voscript-skills
          NOTES
          )"
